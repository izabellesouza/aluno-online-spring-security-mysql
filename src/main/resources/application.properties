spring.application.name=Aluno Online

spring.datasource.url=jdbc:mysql://localhost:3306/aluno_online?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=aluno_online_user
spring.datasource.password=Aluno@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
api.security.token.secret=12345678